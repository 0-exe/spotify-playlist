version: "3.9"

services:
  spotify-ui:
    build: .
    image: spotify-playlist:latest
    container_name: spotify-playlist
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET}
      - SPOTIPY_REDIRECT_URI=${SPOTIPY_REDIRECT_URI:-http://192.168.178.222:8000/callback}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/spotify_ui.db
    volumes:
      # Persistiert sowohl die SQLite-DB als auch den Spotify-OAuth-Cache
      - spotify_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      heimnetz:
        ipv4_address: 192.168.178.222

networks:
  heimnetz:
    driver: macvlan
    driver_opts:
      parent: ${PARENT_INTERFACE:-eth0}
    ipam:
      config:
        - subnet: 192.168.178.0/24
          gateway: 192.168.178.1

volumes:
  spotify_data:
    driver: local
