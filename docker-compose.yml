version: "3.9"

services:
  spotify-ui:
    build: .
    image: spotify-playlist:latest
    container_name: spotify-playlist
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET}
      # WICHTIG: Muss auf deinen Proxmox-Server zeigen, z.B.:
      # http://192.168.1.50:8000/callback  oder  https://spotify.deine-domain.de/callback
      - SPOTIPY_REDIRECT_URI=${SPOTIPY_REDIRECT_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/spotify_ui.db
    volumes:
      # Persistent SQLite database (artist weights)
      - spotify_data:/app/data
      # Persistent Spotify OAuth token cache
      - spotify_cache:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      # Optionale Traefik-Labels (auskommentieren wenn du Traefik nutzt)
      # - "traefik.enable=true"
      # - "traefik.http.routers.spotify.rule=Host(`spotify.deine-domain.de`)"
      # - "traefik.http.routers.spotify.entrypoints=websecure"
      # - "traefik.http.routers.spotify.tls.certresolver=letsencrypt"
      # - "traefik.http.services.spotify.loadbalancer.server.port=8000"

volumes:
  spotify_data:
    driver: local
  spotify_cache:
    driver: local
